name: Regenerate Defconfig

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'URL repo kernel'
        required: true
        default: ''
      kernel_branch:
        description: 'Branch kernel (default: main)'
        required: false
        default: 'main'
      output_name:
        description: 'Output filename (e.g., gki_defconfig)'
        required: false
        default: 'gki_defconfig'

jobs:
  regen:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 git curl libelf-dev build-essential flex bison \
            libssl-dev libncurses-dev zlib1g-dev bc dwarves

      - name: Clone kernel source
        env:
          KERNEL_REPO: ${{ github.event.inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
        run: |
          set -euo pipefail
          BRANCH="${KERNEL_BRANCH:-main}"
          if [ -z "${KERNEL_REPO:-}" ]; then
            echo "::error::kernel_repo kosong"
            exit 1
          fi
          git clone --depth=1 "$KERNEL_REPO" -b "$BRANCH" kernel_workspace

      - name: Cache Neutron Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: toolchains/clang
          key: neutron-clang-full-v2

      - name: Download & verify Neutron Clang
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p toolchains/clang && cd toolchains/clang

          if [ -x bin/clang ] && ./bin/clang --version >/dev/null 2>&1; then
            echo "Clang dari cache valid, lewati unduhan."
          else
            echo "Cache kosong/rusak, unduh ulang Neutron Clang..."
            rm -rf ./*
            curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
            chmod +x antman
            ./antman -S latest
            ./antman --patch=glibc
          fi

          ./bin/clang --version

      - name: Download defconfig & regenerate
        env:
          KERNEL_REPO:   ${{ github.event.inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
          OUTPUT_NAME:   ${{ github.event.inputs.output_name }}
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          MAKE="make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1"

          BRANCH="${KERNEL_BRANCH:-main}"

          # Normalisasi URL repo -> owner/repo
          REPO_PATH="$KERNEL_REPO"
          REPO_PATH="${REPO_PATH#https://github.com/}"
          REPO_PATH="${REPO_PATH#http://github.com/}"
          REPO_PATH="${REPO_PATH#git@github.com:}"
          REPO_PATH="${REPO_PATH%.git}"
          REPO_PATH="${REPO_PATH%/}"

          if [ -z "$REPO_PATH" ] || [ "$REPO_PATH" = "$KERNEL_REPO" ]; then
            echo "::error::kernel_repo tidak valid: '$KERNEL_REPO'"
            exit 1
          fi

          # Nama defconfig target = OUTPUT_NAME
          DEFCONFIG_NAME="${OUTPUT_NAME}"
          DEFCONFIG_REL="arch/arm64/configs/${DEFCONFIG_NAME}"

          cd kernel_workspace

          # Pakai file dari hasil clone kalau ada; kalau tidak, unduh dari raw
          if [ -f "$DEFCONFIG_REL" ]; then
            echo "Defconfig ditemukan dari hasil clone: $DEFCONFIG_REL"
          else
            DEFCONFIG_URL="https://raw.githubusercontent.com/${REPO_PATH}/${BRANCH}/${DEFCONFIG_REL}"
            echo "Defconfig tidak ada di clone, unduh: $DEFCONFIG_URL"
            curl -fLSs "$DEFCONFIG_URL" -o "$DEFCONFIG_REL" || {
              echo "::error::Gagal mengunduh $DEFCONFIG_URL"
              exit 1
            }
          fi

          $MAKE "$DEFCONFIG_NAME"
          cp out/.config "out/${OUTPUT_NAME}"

          echo "=== Info hasil regenerate ==="
          echo "Baris defconfig awal : $(wc -l < "$DEFCONFIG_REL")"
          echo "Baris full .config   : $(wc -l < "out/${OUTPUT_NAME}")"

      - name: Upload hasil regenerate
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-defconfig
          path: "kernel_workspace/out/${{ github.event.inputs.output_name }}"
          if-no-files-found: error
